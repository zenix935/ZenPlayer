name: Cross-Platform Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: ZenPlayer-Windows.zip
          - os: macos-latest # Apple Silicon (M1/M2/M3)
            platform: macos
            artifact_name: ZenPlayer-macOS.dmg
          - os: ubuntu-latest
            platform: linux
            artifact_name: ZenPlayer-Linux.AppImage

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          target: 'desktop'
          modules: 'qtmultimedia'

      # ==========================================
      # 1. WINDOWS BUILD & DEPLOY
      # ==========================================
      - name: Install Dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install vlc cmake ninja -y

      - name: Build & Package (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          # 1. Configure and Build
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          
          # 2. Install executable into a staging directory
          cmake --install build --prefix release_stage
          
          # 3. Run windeployqt on the installed executable
          windeployqt release_stage/bin/ZenPlayer.exe --no-compiler-runtime
          
          # 4. Copy libVLC binaries next to the executable
          xcopy /E /I "C:\Program Files\VideoLAN\VLC\plugins" "release_stage\bin\plugins"
          copy "C:\Program Files\VideoLAN\VLC\libvlc.dll" "release_stage\bin\"
          copy "C:\Program Files\VideoLAN\VLC\libvlccore.dll" "release_stage\bin\"
          
          # 5. Compress everything inside release_stage/bin/
          powershell Compress-Archive -Path release_stage\bin\* -DestinationPath ${{ matrix.artifact_name }}

      # ==========================================
      # 2. MACOS BUILD & DEPLOY
      # ==========================================
      - name: Install Dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install cmake ninja vlc

      - name: Build & Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          # Patch Qt's FindWrapOpenGL.cmake to prevent searching for deprecated AGL framework on macOS
          find "$Qt6_DIR" -name "FindWrapOpenGL.cmake" -exec sed -i '' 's/NAMES AGL/NAMES AGL_DISABLED/g' {} + || true

          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$Qt6_DIR"
          cmake --build build
          
          # Deploy Qt dependencies and bundle into DMG
          macdeployqt build/ZenPlayer.app -dmg
          mv build/ZenPlayer.dmg ${{ matrix.artifact_name }}

      # ==========================================
      # 3. LINUX BUILD & DEPLOY (AppImage)
      # ==========================================
      - name: Install Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvlc-dev libvlccore-dev vlc \
            libopengl0 libgl1 libglx0 libegl1 libgldispatch0 libgl1-mesa-dev libegl1-mesa-dev
          
          # Download linuxdeploy tools for AppImage generation
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build & Package (Linux AppImage)
        if: matrix.platform == 'linux'
        run: |
          # Configure, build, and install into AppDir
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR=build/AppDir cmake --install build
          
          # Ensure Qt OpenGL integrations and extra libraries are bundled
          export EXTRA_QT_PLUGINS="xcbglintegrations"
          
          EXTRA_LIBS=""
          for lib in /usr/lib/x86_64-linux-gnu/libOpenGL.so.0 /usr/lib/x86_64-linux-gnu/libGLdispatch.so.0 /usr/lib/x86_64-linux-gnu/libGLX.so.0 /usr/lib/x86_64-linux-gnu/libEGL.so.1 /usr/lib/x86_64-linux-gnu/libGL.so.1; do
            if [ -f "$lib" ]; then
              EXTRA_LIBS="$EXTRA_LIBS -l $lib"
            fi
          done
          
          # Generate AppImage
          ./linuxdeploy-x86_64.AppImage --appdir build/AppDir $EXTRA_LIBS --plugin qt --output appimage
          mv ZenPlayer-*.AppImage ${{ matrix.artifact_name }}

      # ==========================================
      # 4. UPLOAD TO GITHUB RELEASES
      # ==========================================
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}